<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - SILVIACILENE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🧠⛵ {{ titulo }}</h1>
            <p>Portal Náutico Unificado</p>
            <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">
                🌙 Modo Oscuro
            </button>
        </header>
        
        <nav class="nav-bar">
            <a href="/" class="nav-btn nav-home">🏠 Inicio</a>
            <a href="/tracker" class="nav-btn nav-tracker">📊 Tracker</a>
            <a href="/admin" class="nav-btn nav-admin">⚙️ Admin</a>
        </nav>
        
        <main>
            {% block content %}{% endblock %}
        </main>
        
        <footer class="footer">
            <p>⛵ SILVIACILENE © 2026 | Puerto: Oslofjord | Capitán: Nito</p>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='js/temas.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
